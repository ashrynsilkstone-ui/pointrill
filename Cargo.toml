[package]
name = "pointrill"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "Desktop settings for OpenRazer mice and receivers"

[dependencies]
anyhow = "1"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg", "gif"] }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
zbus = { version = "5.19", features = ["blocking-api"] }
