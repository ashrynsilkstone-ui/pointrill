[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pointrill"
version = "0.1.0"
description = "Qt settings for OpenRazer mice and wireless receivers"
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["PySide6>=6.5"]

[project.gui-scripts]
pointrill = "pointrill.__main__:main"

[tool.setuptools]
packages = ["pointrill"]
include-package-data = false

[tool.setuptools.package-data]
pointrill = ["assets/*.webp"]
